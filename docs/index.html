<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowd Mark</title>
<meta name="description" content="A terminal for tokenised pre-IPO stock. It reads the prediction markets live in your browser, rebuilds what the crowd says each company is worth as the bets change, shows what a round trip costs and what the issuer can do to your balance, and publishes a mark on Solana that anyone can refresh and verify.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Crowd Mark">
<meta property="og:description" content="What the crowd says a private company is worth, rebuilt live from real bets, and published where nobody can quietly edit it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="terminal.css">
</head>
<body>
<noscript>
  <main style="padding:40px;max-width:60ch;font-family:system-ui;color:#e9ecf1">
    <h1>Crowd Mark</h1>
    <p>This terminal reads live prediction markets and the Solana chain in your browser, so it
      needs JavaScript switched on. Nothing is computed on a server, which is the point.</p>
  </main>
</noscript>
<script type="module" src="terminal.js"></script>
</body>
</html>
